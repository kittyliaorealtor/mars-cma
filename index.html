<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MARS CMA Builder</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,700&display=swap">
<style>
/* Layout: a working form on the left, a live stack of letter-size report pages on the right.
   Deliberately single (light) theme: the report is a printed document in black, white, gold and gray. */
:root{
  color-scheme: light;
  --ink:#0F0F0E;        /* report black */
  --paper:#FFFFFF;
  --gold:#B08D57;       /* muted champagne gold */
  --gold-soft:#D9C7A4;
  --gray:#7C7972;       /* warm gray, leans toward the gold */
  --mist:#EFEDE8;       /* light gray fills and hairlines */
  --ui-bg:#E7E5E0;
  --ui-panel:#FAFAF8;
  --ui-line:#D9D6CF;
  --ui-text:#1C1B19;
  --ui-muted:#6E6B64;
  --ok:#2F6B45;
  --warn:#9A4B1F;
  /* Helvetica where the computer has it (Macs, iPhones); Arimo, a free metric match, everywhere else */
  --display:"Helvetica Neue",Helvetica,Arimo,Arial,sans-serif;
  --sans:"Helvetica Neue",Helvetica,Arimo,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{background:var(--ui-bg);color:var(--ui-text);font-family:var(--sans);font-size:14px}

/* ---------- App shell ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.brand b{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:13px;font-weight:500;border-radius:2px;padding:8px 14px;cursor:pointer;border:1px solid transparent;line-height:1.2}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-gold:hover{background:#c29f69}
.btn-ghost{background:transparent;color:#fff;border-color:#4a4843}
.btn-ghost:hover{border-color:var(--gold-soft)}
.btn-line{background:#fff;color:var(--ui-text);border-color:var(--ui-line)}
.btn-line:hover{border-color:var(--gold)}
.btn-small{padding:5px 10px;font-size:12px}
.btn-danger{color:var(--warn)}
.btn[disabled]{opacity:.5;cursor:default}

.app{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);min-height:calc(100% - 64px)}
.form{background:var(--ui-panel);border-right:1px solid var(--ui-line);
  padding-block:16px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;
  overflow:auto;max-height:calc(100vh - 64px);position:sticky;top:64px}
.preview{padding:24px;overflow:auto;min-width:0}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .form{max-height:none;position:static;border-right:0;border-bottom:1px solid var(--ui-line);padding-right:max(16px,env(safe-area-inset-right,0px))}
  .preview{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

.notice{background:#F4EBDA;border:1px solid var(--gold-soft);padding:10px 12px;font-size:13px;line-height:1.45;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.notice p{margin:0}

details.sec{border-top:1px solid var(--ui-line)}
details.sec:last-of-type{border-bottom:1px solid var(--ui-line)}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 2px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h2{margin:0;font-family:var(--display);font-weight:600;font-size:16px}
details.sec>summary small{color:var(--ui-muted);font-size:12px}
details.sec>summary::after{content:"+";font-size:18px;color:var(--gold);margin-left:8px}
details.sec[open]>summary::after{content:"–"}
.secbody{display:flex;flex-direction:column;gap:12px;padding-bottom:18px}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ui-muted);font-weight:500}
.field input,.field textarea,.field select,.row input{font:inherit;font-size:14px;color:var(--ui-text);background:#fff;border:1px solid var(--ui-line);border-radius:2px;padding:8px 10px;width:100%;min-width:0}
.field textarea{min-height:84px;resize:vertical;line-height:1.45}
.field input:focus,.field textarea:focus,.field select:focus,.row input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(176,141,87,.2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--ui-muted);line-height:1.45;margin:0}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px}
.toggle input{width:16px;height:16px;accent-color:var(--gold)}

.rep{display:flex;flex-direction:column;gap:6px}
.row{display:grid;gap:6px;align-items:center}
.row.spec{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr) auto}
.row.hl{grid-template-columns:minmax(0,1fr) auto}
.row.mk{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr) minmax(0,.8fr) auto}
.x{border:0;background:none;color:var(--ui-muted);font-size:18px;cursor:pointer;padding:2px 6px;line-height:1}
.x:hover{color:var(--warn)}
.x:focus-visible{outline:2px solid var(--gold)}
.photo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.photo .thumb{width:64px;height:44px;background:var(--mist) center/cover no-repeat;border:1px solid var(--ui-line)}

.compgroup{display:flex;flex-direction:column;gap:8px}
.compgroup h3{margin:6px 0 0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ui-muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
details.comp{background:#fff;border:1px solid var(--ui-line)}
details.comp>summary{list-style:none;cursor:pointer;padding:9px 10px;display:flex;gap:8px;align-items:center}
details.comp>summary::-webkit-details-marker{display:none}
details.comp>summary .addr{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
details.comp>summary .pr{color:var(--ui-muted);font-variant-numeric:tabular-nums;font-size:13px}
.compbody{padding:4px 10px 12px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--mist)}
.comptools{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.sold{background:var(--ink)}
.dot.pending{background:var(--gold)}
.dot.active{background:#fff;border:1.5px solid var(--ink)}
.importbox{border:1px dashed var(--gold-soft);background:#fff;padding:12px;display:flex;flex-direction:column;gap:8px}
.result{font-size:13px;line-height:1.45;margin:0}
.result.ok{color:var(--ok)}
.result.bad{color:var(--warn)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;font-size:13px;border-left:3px solid var(--gold);max-width:calc(100% - 32px);z-index:40}
.pagecount{font-size:12px;color:var(--ui-muted);letter-spacing:.12em;text-transform:uppercase;margin:0 0 14px}

/* ---------- Report pages (8.5 x 11 in at 96 dpi) ---------- */
#pages{--s:1;display:flex;flex-direction:column;align-items:center;gap:22px}
.pagewrap{width:calc(816px * var(--s));height:calc(1056px * var(--s));flex:none;box-shadow:0 6px 24px rgba(15,15,14,.14)}
.page{width:816px;height:1056px;transform:scale(var(--s));transform-origin:0 0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);position:relative;overflow:hidden;display:flex;flex-direction:column}

.band{background:var(--ink);color:#fff;padding:34px 56px 30px;flex:none;position:relative}
.band::after{content:"";position:absolute;left:56px;right:56px;bottom:0;height:2px;background:var(--gold)}
.eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:500}
.band h1{margin:10px 0 0;font-family:var(--display);font-weight:500;font-size:32px;line-height:1.12;letter-spacing:-.015em}
.band h1 em{font-style:normal;font-weight:400;color:var(--gold-soft);font-size:.5em;letter-spacing:.2em;text-transform:uppercase;margin-left:14px}
.pbody{flex:1;min-height:0;overflow:hidden;padding:30px 56px 10px;display:flex;flex-direction:column;gap:18px}
.pfoot{flex:none;height:48px;margin:0 56px;border-top:1px solid var(--mist);display:flex;align-items:center;justify-content:space-between;
  font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gray)}
.pfoot b{color:var(--ink);font-weight:500}

/* cover */
.cover{background:var(--ink);color:#fff}
.cover .photo-bg{position:absolute;left:0;right:0;top:0;height:640px;background-size:cover;background-position:center}
.cover .photo-fade{position:absolute;left:0;right:0;top:0;height:640px;background:linear-gradient(180deg,rgba(15,15,14,.15) 0%,rgba(15,15,14,.35) 55%,#0F0F0E 100%)}
.cover .frame{position:absolute;inset:28px;border:1px solid rgba(176,141,87,.7)}
.cover .content{position:absolute;left:84px;right:84px;bottom:110px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cover .rule{width:64px;height:1px;background:var(--gold);margin:26px 0}
.cover .addr{font-family:var(--display);font-weight:500;font-size:52px;line-height:1.05;letter-spacing:-.025em;margin:18px 0 10px}
.cover .town{font-family:var(--display);font-weight:400;font-size:20px;color:#CFCBC3;letter-spacing:.01em}
.cover .meta{display:flex;flex-direction:column;gap:9px;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#CFCBC3}
.cover .meta b{color:#fff;font-weight:500}
.cover .mark{position:absolute;left:0;right:0;bottom:54px;display:flex;justify-content:center;align-items:center}
.cover .mark img{max-height:42px;max-width:220px}
.cover .mark span{font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold)}
.cover .toplogo{position:absolute;left:0;right:0;top:74px;display:flex;justify-content:center;align-items:center;z-index:2}
.cover .toplogo img{max-height:150px;max-width:300px}
.cover .toplogo span{font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);font-weight:500}

/* subject */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.panel{border:1px solid var(--mist);padding:22px 24px}
.panel h3,.mini{margin:0 0 14px;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:500}
.specs{display:flex;flex-direction:column}
.spec{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--mist);font-size:13px;align-items:baseline}
.spec:last-child{border-bottom:0}
.spec span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gray)}
.spec b{font-weight:500;color:var(--ink)}
.hls{display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none}
.hls li{display:grid;grid-template-columns:14px 1fr;gap:10px;font-family:var(--display);font-weight:500;font-size:14.5px;line-height:1.4}
.hls li::before{content:"";width:6px;height:6px;background:var(--gold);transform:rotate(45deg);margin-top:7px}
.school{background:var(--ink);color:#fff;padding:20px 24px}
.school .mini{margin-bottom:8px}
.school p{margin:0;font-family:var(--display);font-weight:500;font-size:15px}

/* market */
.mtable{width:100%;border-collapse:collapse;font-size:13px}
.mtable th{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:500;text-align:right;padding:0 0 12px;border-bottom:1px solid var(--ink)}
.mtable th:first-child{text-align:left;color:var(--gray)}
.mtable td{padding:14px 0;border-bottom:1px solid var(--mist);text-align:right;font-variant-numeric:tabular-nums}
.mtable td:first-child{text-align:left;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gray)}
.mtable td b{font-family:var(--display);font-weight:500;font-size:18px;letter-spacing:-.01em;color:var(--ink)}
.mnote{font-size:11px;line-height:1.5;color:var(--gray);margin:0}
.mnote i{color:var(--ink)}

/* comp cards */
.card{border:1px solid var(--mist);padding:18px 22px 16px;display:flex;flex-direction:column;gap:12px;flex:none}
.chead{display:grid;grid-template-columns:1fr auto;gap:6px 18px;align-items:start}
.pillrow{display:flex;align-items:center;gap:12px}
.pill{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;padding:5px 10px 4px;font-weight:500;line-height:1}
.pill.sold{background:var(--ink);color:var(--gold-soft)}
.pill.pending{background:var(--gold);color:var(--ink)}
.pill.active{background:#fff;color:var(--ink);border:1px solid var(--ink);padding:4px 9px 3px}
.cdate{font-size:11px;color:var(--gray);letter-spacing:.06em}
.caddr{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:-.01em;margin:9px 0 3px;line-height:1.2}
.csub{font-size:11.5px;color:var(--gray)}
.cprice{font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:-.02em;text-align:right;line-height:1}
.cprice small{display:block;font-family:var(--sans);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gray);font-weight:400;margin-top:8px}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px;border-top:1px solid var(--mist);padding-top:12px}
.cgrid div{display:flex;flex-direction:column;gap:3px;min-width:0}
.cgrid span{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gray)}
.cgrid b{font-weight:500;font-size:13.5px;font-variant-numeric:tabular-nums}

/* pricing */
.prices{display:grid;grid-template-columns:1fr 1.25fr 1fr;border:1px solid var(--mist)}
.prices div{padding:26px 18px;text-align:center;display:flex;flex-direction:column;gap:10px}
.prices div+div{border-left:1px solid var(--mist)}
.prices span{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gray)}
.prices b{font-family:var(--display);font-weight:500;font-size:28px;letter-spacing:-.02em}
.prices .rec{background:var(--ink);color:#fff}
.prices .rec span{color:var(--gold)}
.prices .rec b{font-size:38px}
.notes{font-size:13.5px;line-height:1.65;color:#33322F;margin:0;white-space:pre-wrap}
.agent{background:var(--ink);color:#fff;padding:26px 28px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.agent .nm{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.01em;margin:6px 0 4px}
.agent .ttl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#CFCBC3}
.agent .ct{display:flex;flex-direction:column;gap:6px;text-align:right;font-size:12.5px;color:#E8E5DF}
.agent img{max-height:64px;max-width:160px}
.empty{color:#B9B5AD}

@media (prefers-reduced-motion:no-preference){ .pagewrap{transition:width .15s,height .15s} }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><b>CMA Builder</b><span id="teamTag">The MARS Team</span></div>
  <div class="actions">
    <button class="btn btn-gold" id="savePdf" type="button">Save PDF</button>
    <button class="btn btn-ghost" id="saveDraft" type="button">Save draft file</button>
    <button class="btn btn-ghost" id="openDraft" type="button">Open draft file</button>
    <button class="btn btn-ghost" id="newCma" type="button">Start new CMA</button>
    <input type="file" id="draftFile" accept=".json,application/json" hidden>
  </div>
</div>

<div class="app">
  <aside class="form" id="form" aria-label="Report details"></aside>
  <main class="preview" id="preview">
    <p class="pagecount" id="pageCount"></p>
    <div id="pages"></div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="lib/papaparse.min.js"></script>
<script src="lib/html2canvas.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script>
(function(){
const KEY='mars-cma-draft-v1';
let LOGO='';
(function loadLogo(){const img=new Image();img.onload=()=>{try{const cv=document.createElement('canvas');cv.width=img.naturalWidth;cv.height=img.naturalHeight;cv.getContext('2d').drawImage(img,0,0);LOGO=cv.toDataURL('image/png');}catch(e){LOGO='logo.png';}renderPages();};img.src='logo.png?v=1';})();
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let uid=0; const nid=()=>'c'+Date.now().toString(36)+(uid++);

/* ---------- Data ---------- */
function blankComp(status){return {id:nid(),status:status||'sold',address:'',town:'',district:'',closeDate:'',listPrice:'',price:'',beds:'',baths:'',sqft:'',lot:'',dom:'',pool:'',taxes:'',style:'',year:''};}
function defaultAgent(){return {name:'Kitty Liao',title:'NYS Licensed Real Estate Salesperson',team:'The MARS Team',brokerage:'Epique Realty',phone:'',email:'',office:'400 Garden City Plaza, Suite 438, Garden City, NY 11530',logo:''};}
function blankReport(agent){
  return {
    example:false,
    agent:agent||defaultAgent(),
    cover:{eyebrow:'Comparative Market Analysis',address:'',town:'',state:'NY',zip:'',homeowner:'',date:monthNow(),photo:''},
    subject:{eyebrow:'Subject Property',
      specs:['Style','Year Built','Bedrooms','Bathrooms','Living Area','Lot Size','Location','Annual Taxes'].map(l=>({label:l,value:''})),
      highlights:[''],districtTitle:'',schools:''},
    market:{show:true,eyebrow:'Neighborhood Overview',title:'Market Snapshot · Last 180 Days',areaA:'',areaB:'',
      rows:['Sold — Last 180 Days','Active Inventory','Median Days on Market','Average Sale Price','Median Sale Price','Avg Home Size (Sold)','Avg Home Size (Active)'].map(l=>({label:l,a:'',b:''})),
      source:'Source: OneKey MLS · Single-Family Residences · As of '+todayLong(),footnote:''},
    titles:{sold:'Closed in the Last 180 Days',pending:'Under Contract',active:'Currently On the Market'},
    comps:[],
    pricing:{show:true,low:'',rec:'',high:'',notes:''}
  };
}
function exampleReport(){
  const r=blankReport();
  r.example=true;
  r.cover=Object.assign(r.cover,{address:'48 Sample Court',town:'Smithtown',zip:'11787',homeowner:'The Example Family'});
  r.subject.specs=[['Style','Colonial'],['Year Built','1952'],['Bedrooms','4'],['Bathrooms','2 full · 1 half'],['Carriage House','Studio above garage'],['Living Area','2,450 sq ft'],['Lot Size','0.92 acres'],['Location','Mid-block'],['Annual Taxes','$16,840']].map(([label,value])=>({label,value}));
  r.subject.highlights=['New roof, furnace & oil-to-gas conversion (May 2025)','Detached 2-car garage with studio carriage house above','Separate cesspool & electric for carriage house','In-ground pool, multiple patios & covered porch','Mature plantings & irrigation system','Horse rights on property'];
  r.subject.districtTitle='Smithtown Central School District';
  r.subject.schools='Smithtown Elementary · Accompsett Middle · Smithtown High School West';
  r.market.areaA='Smithtown';r.market.areaB='11787';
  const mv=[['38','21'],['24','14'],['19 days','22 days'],['$912,400','$948,100'],['$875,000','$905,000'],['2,310 sq ft','2,420 sq ft'],['2,560 sq ft','2,640 sq ft']];
  r.market.rows.forEach((row,i)=>{row.a=mv[i][0];row.b=mv[i][1];});
  r.market.footnote='Average days on market is skewed by a 560-day outlier listing. The median (19 days) reflects the typical pace.';
  const c=(status,address,closeDate,listPrice,price,beds,baths,sqft,lot,dom,pool,taxes,style,year)=>Object.assign(blankComp(status),{address,town:'Smithtown',district:'Smithtown CSD',closeDate,listPrice,price,beds,baths,sqft,lot,dom,pool,taxes,style,year});
  r.comps=[
    c('sold','12 Sample Lane','2026-09-18','899000','925000','4','2.5','2380','0.75 ac','14','Yes','16210','Colonial','1958'),
    c('sold','7 Example Drive','2026-08-02','949000','940000','4','3','2610','1.02 ac','31','Yes','17940','Colonial','1949'),
    c('sold','203 Specimen Road','2026-06-27','829000','861000','3','2','2120','0.50 ac','9','No','14320','Cape','1955'),
    c('sold','91 Template Way','2026-05-11','1050000','1015000','5','3','2890','1.10 ac','47','Yes','19260','Post-Modern','1987'),
    c('pending','5 Placeholder Path','','925000','','4','2.5','2400','0.80 ac','12','Yes','16700','Colonial','1961'),
    c('pending','66 Demo Court','','879000','','4','2','2250','0.62 ac','20','No','15480','Split Level','1964'),
    c('active','30 Mockup Avenue','','989000','','4','3','2700','1.00 ac','6','Yes','18120','Colonial','1972'),

const digits=v=>String(v==null?'':v).replace(/[^0-9.]/g,'');
function money(v){const s=String(v==null?'':v).trim(); if(!s) return ''; const n=parseFloat(digits(s)); if(!/^\$?[\d,]+(\.\d+)?$/.test(s)||isNaN(n)) return s; return '$'+Math.round(n).toLocaleString('en-US');}
function num(v){const s=String(v==null?'':v).trim(); if(!s) return ''; if(!/^[\d,]+(\.\d+)?$/.test(s)) return s; return Number(s.replace(/,/g,'')).toLocaleString('en-US');}
function sqft(v){const s=num(v); return s && /^[\d,]+$/.test(s)?s+' sq ft':s;}
function lot(v){const s=String(v||'').trim(); if(!s) return ''; if(/^[\d,]+$/.test(s)) return num(s)+' sq ft'; return s;}
function days(v){const s=String(v||'').trim(); if(!s) return ''; return /^\d+$/.test(s)? s+(s==='1'?' day':' days'):s;}
function taxes(v){const m=money(v); return m && m.startsWith('$')? m+'/yr':m;}
function pctOfList(c){const l=parseFloat(digits(c.listPrice)),p=parseFloat(digits(c.price)); if(!l||!p) return ''; return (Math.round(p/l*1000)/10)+'% of list';}
function fmtDate(v){if(!v) return ''; const d=parseDate(v); return d? d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):v;}
function parseDate(v){if(!v) return null; let m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=String(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(m){let y=+m[3]; if(y<100) y+=2000; return new Date(y,+m[1]-1,+m[2]);}
  const d=new Date(v); return isNaN(d)?null:d;}
function isoDate(v){const d=parseDate(v); if(!d) return ''; return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function shrink(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  const s=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
  const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,cv.width,cv.height);res(file.type==='image/png'?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',.86));};img.src=r.result;};r.readAsDataURL(file);});}

/* ---------- CSV import ---------- */
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
const MAP={
  address:['address','streetaddress','fulladdress','unparsedaddress','propertyaddress','addr','location'],
  status:['status','listingstatus','standardstatus','mlsstatus','stat'],
  listPrice:['listprice','lp','currentprice','listingprice','askingprice','originallistprice'],
  price:['closeprice','soldprice','saleprice','sp','closedprice','sellingprice'],
  closeDate:['closedate','solddate','closingdate','closeddate','saledate','coe'],
  beds:['bedroomstotal','beds','bedrooms','br','bedstotal','totalbedrooms'],
  baths:['bathroomstotalinteger','bathroomstotal','bathstotal','bathrooms','baths','ba','totalbaths'],
  sqft:['livingarea','sqft','approxsqft','approximatesqft','squarefeet','buildingareatotal','livingareasqft','sqftliving'],
  lot:['lotsizesquarefeet','lotsize','lotsizearea','lotsqft','lotsizeacres','acres','lotsizedimensions'],
  dom:['dom','daysonmarket','cdom','cumulativedaysonmarket'],
  pool:['pool','poolprivateyn','poolfeatures','poolyn'],
  taxes:['taxannualamount','taxes','annualtaxes','totaltaxes','taxamount','realestatetaxes','tax'],
  style:['architecturalstyle','style','homestyle'],
  year:['yearbuilt','yrbuilt','builtyear'],
  town:['city','town','postalcity','municipality'],
  district:['highschooldistrict','schooldistrict','elementaryschooldistrict','district']
};
function importCsv(file,replace){
  Papa.parse(file,{header:true,skipEmptyLines:true,complete:res=>{
    const heads=res.meta.fields||[]; const col={};
    for(const [k,names] of Object.entries(MAP)){for(const n of names){const h=heads.find(h=>norm(h)===n); if(h){col[k]=h;break;}}}
    const parts=['streetnumber','streetdirprefix','streetname','streetsuffix','unitnumber'].map(n=>heads.find(h=>norm(h)===n)).filter(Boolean);
    if(!col.address&&!parts.length){importMsg=`<p class="result bad">No address column was found in that file. Check that the export includes the street address, then try again.</p>`;renderForm();return;}
    const full=heads.find(h=>norm(h)==='bathroomsfull'),half=heads.find(h=>norm(h)==='bathroomshalf');
    let added=[],skipped=0;
    for(const row of res.data){
      const g=k=>col[k]?String(row[col[k]]||'').trim():'';
      const address=g('address')||parts.map(p=>String(row[p]||'').trim()).filter(Boolean).join(' ');
      if(!address){skipped++;continue;}
      const raw=g('status').toLowerCase(); let status;
      if(/clos|sold/.test(raw)) status='sold'; else if(/pend|contract|contingent|accepted/.test(raw)) status='pending';
      else if(/activ|coming|new|back on|price/.test(raw)) status='active'; else if(/expir|withdr|cancel|off/.test(raw)){skipped++;continue;}
      else status=g('price')?'sold':'active';
      let baths=g('baths'); if(!baths&&full){const f=+(row[full]||0),h=+(row[half]||0); baths=h?`${f} full · ${h} half`:String(f||'');}
      let lotv=g('lot'); if(lotv&&col.lot&&/acre/i.test(col.lot)&&/^[\d.]+$/.test(lotv)) lotv=lotv+' ac';
      let pool=g('pool'); if(/^(true|yes|y|1)$/i.test(pool)) pool='Yes'; else if(/^(false|no|n|0)$/i.test(pool)) pool='No';
      added.push(Object.assign(blankComp(status),{address,town:g('town'),district:g('district'),closeDate:isoDate(g('closeDate'))||g('closeDate'),
        listPrice:digits(g('listPrice'))||g('listPrice'),price:digits(g('price'))||g('price'),beds:g('beds'),baths,sqft:digits(g('sqft'))||g('sqft'),
        lot:lotv,dom:g('dom'),pool,taxes:digits(g('taxes'))||g('taxes'),style:g('style'),year:g('year')}));
    }
    if(!added.length){importMsg=`<p class="result bad">No homes could be read from that file. Make sure the first row holds the column names.</p>`;renderForm();return;}
    if(replace) S.comps=[]; S.comps.push(...added); S.example=false;
    const n=st=>added.filter(c=>c.status===st).length;
    const missing=['price','closeDate','sqft','dom','taxes'].filter(k=>!col[k]).map(k=>({price:'sold price',closeDate:'closed date',sqft:'living area',dom:'days on market',taxes:'taxes'}[k]));
    importMsg=`<p class="result ok">Imported ${added.length} homes: ${n('sold')} sold, ${n('pending')} pending, ${n('active')} active.${skipped?` Skipped ${skipped} rows that were blank, expired or withdrawn.`:''}</p>`+
      (missing.length?`<p class="result bad">Not found in the file: ${missing.join(', ')}. Fill those in by hand or add the columns to your MLS export.</p>`:'');
    openSecs.add('comps'); changed(true);
  },error:()=>{importMsg=`<p class="result bad">That file could not be read as a CSV.</p>`;renderForm();}});
}

      <div class="eyebrow">${esc(c.eyebrow)}</div>
      <div class="addr">${c.address?esc(c.address):'<span class="empty">Street address</span>'}</div>
      <div class="town">${esc([c.town,[c.state,c.zip].filter(Boolean).join(' ')].filter(Boolean).join(', '))}</div>
      <div class="rule"></div>
      <div class="meta">${c.homeowner?`<div>Prepared for <b>${esc(c.homeowner)}</b></div>`:''}<div>Prepared by <b>${esc(a.name)}</b></div><div>${esc(c.date)}</div></div>
    </div>
    <div class="mark"><span>${LOGO?esc(a.brokerage):esc(a.team)+(a.brokerage?' · '+esc(a.brokerage):'')}</span></div>
  </div>`;
  root.appendChild(w);
}
function compCard(c){
  const sold=c.status==='sold';
  const label={sold:'Sold',pending:'Pending',active:'Active'}[c.status];
  const price=sold?money(c.price||c.listPrice):money(c.listPrice);
  const sub=sold?[c.listPrice?'Listed at '+money(c.listPrice):'',pctOfList(c)].filter(Boolean).join(' · '):[c.town?c.town+', NY':'',c.district].filter(Boolean).join(' · ');
  const f=(l,v)=>`<div><span>${l}</span><b>${v}</b></div>`;
  return `<div class="card"><div class="chead"><div>
      <div class="pillrow"><span class="pill ${c.status}">${label}</span>${sold&&c.closeDate?`<span class="cdate">Closed ${esc(fmtDate(c.closeDate))}</span>`:''}</div>
      <div class="caddr">${c.address?esc(c.address):'<span class="empty">Address</span>'}</div>
      <div class="csub">${esc(sub)||'&nbsp;'}</div></div>
    <div class="cprice">${price?esc(price):'<span class="empty">$—</span>'}<small>${sold?'Sold price':'List price'}</small></div></div>
    <div class="cgrid">${f('Beds / Baths',(c.beds||c.baths)?esc((c.beds||'—')+' / '+(c.baths||'—')):'<span class="empty">—</span>')}${f('Living area',show(c.sqft,sqft))}${f('Lot',show(c.lot,lot))}${f('Days on market',show(c.dom,days))}
      ${f('Pool',show(c.pool))}${f('Taxes',show(c.taxes,taxes))}${f('Style',show(c.style))}${f('Year built',show(c.year))}</div></div>`;
}
function renderPages(){
  root.innerHTML='';
  coverPage();
  const s=S.subject;
  const specs=s.specs.filter(x=>x.label||x.value);const hls=s.highlights.filter(Boolean);
  const subj=[`<div class="cols"><div class="panel"><h3>Property specs</h3><div class="specs">${specs.map(x=>`<div class="spec"><span>${esc(x.label)}</span><b>${show(x.value)}</b></div>`).join('')}</div></div>
    <div class="panel"><h3>Highlights</h3><ul class="hls">${hls.map(h=>`<li>${esc(h)}</li>`).join('')||'<li class="empty">Add highlights in the form</li>'}</ul></div></div>`];
  if(s.districtTitle||s.schools) subj.push(`<div class="school"><div class="mini">${esc(s.districtTitle)}</div><p>${esc(s.schools)}</p></div>`);
  flow(s.eyebrow||'Subject Property',S.cover.address||'Subject property',subj);
  const m=S.market;
  if(m.show){
    const rows=m.rows.filter(r=>r.label||r.a||r.b);
    const blocks=[`<table class="mtable"><thead><tr><th>${esc(m.title?'':'')}&nbsp;</th><th>${esc(m.areaA)}</th><th>${esc(m.areaB)}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.label)}</td><td><b>${show(r.a)}</b></td><td><b>${show(r.b)}</b></td></tr>`).join('')}</tbody></table>`];
    if(m.source||m.footnote) blocks.push(`<div style="display:flex;flex-direction:column;gap:8px">${m.footnote?`<p class="mnote"><i>* ${esc(m.footnote)}</i></p>`:''}${m.source?`<p class="mnote">${esc(m.source)}</p>`:''}</div>`);
    flow(m.eyebrow||'Neighborhood Overview',m.title||'Market Snapshot',blocks);
  }
  const by=st=>S.comps.filter(c=>c.status===st);
  const sold=by('sold').slice().sort((a,b)=>(parseDate(b.closeDate)||0)-(parseDate(a.closeDate)||0));
  flow('Sold',S.titles.sold,sold.map(compCard));
  flow('Pending',S.titles.pending,by('pending').map(compCard));
  flow('Active Inventory',S.titles.active,by('active').map(compCard));
  const p=S.pricing,a=S.agent;
  if(p.show){
    const blocks=[`<div class="prices"><div><span>Low</span><b>${show(p.low,money)}</b></div><div class="rec"><span>Recommended list price</span><b>${show(p.rec,money)}</b></div><div><span>High</span><b>${show(p.high,money)}</b></div></div>`];
    if(p.notes) p.notes.split(/\n\s*\n/).forEach(par=>blocks.push(`<p class="notes">${esc(par.trim())}</p>`));
    blocks.push(`<div class="agent"><div><div class="eyebrow">Your agent</div><div class="nm">${esc(a.name)}</div><div class="ttl">${esc(a.title)}</div></div>
      <div class="ct">${LOGO?`<img src="${LOGO}" alt="" style="align-self:flex-end">`:''}${a.phone?`<div>${esc(a.phone)}</div>`:''}${a.email?`<div>${esc(a.email)}</div>`:''}<div>${esc([a.team,a.brokerage].filter(Boolean).join(' · '))}</div>${a.office?`<div>${esc(a.office)}</div>`:''}</div></div>`);
    flow('Pricing Strategy','Where this home should be priced',blocks);
  }
  const pages=root.querySelectorAll('.page');
  pages.forEach((pg,i)=>{const n=pg.querySelector('.pnum'); if(n) n.textContent=`${a.name?a.name+' · ':''}Page ${i+1} of ${pages.length}`;});
  $('#pageCount').textContent=`${pages.length} pages · letter size`;
  fit();
}
function fit(){const w=$('#preview').clientWidth-(innerWidth<=860?32:48); root.style.setProperty('--s',Math.min(1,Math.max(.3,w/816)).toFixed(4));}
new ResizeObserver(fit).observe($('#preview'));

/* ---------- Files: PDF, draft, template ---------- */
function offer(filename,data){
  try{const blob=data instanceof Blob?data:new Blob([data],{type:filename.endsWith('.csv')?'text/csv':'application/json'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Downloaded '+filename);return true;}
  catch(e){toast('That file could not be saved. Try another browser.');return false;}
}
const safeName=s=>(s||'CMA').replace(/[\\/:*?"<>|]+/g,'').trim();
$('#savePdf').addEventListener('click',async()=>{
  const btn=$('#savePdf');if(!window.html2canvas||!window.jspdf){toast('The PDF tools did not load. Reload the page and try again.');return;}
  btn.disabled=true;const label=btn.textContent;
  try{
    clearTimeout(renderT);renderPages();await document.fonts.ready;
    const pages=[...root.querySelectorAll('.page')];
    const pdf=new window.jspdf.jsPDF({unit:'pt',format:'letter',orientation:'portrait',compress:true});
    for(let i=0;i<pages.length;i++){
      btn.textContent=`Page ${i+1} of ${pages.length}…`;
      const canvas=await html2canvas(pages[i],{scale:2.2,useCORS:true,backgroundColor:'#ffffff',logging:false,
        onclone:doc=>{doc.querySelectorAll('.page').forEach(p=>p.style.transform='none');doc.querySelectorAll('.pagewrap').forEach(w=>{w.style.width='816px';w.style.height='1056px';});}});
      if(i) pdf.addPage('letter','portrait');
      pdf.addImage(canvas.toDataURL('image/jpeg',.92),'JPEG',0,0,612,792);
    }
    await offer(`CMA - ${safeName(S.cover.address)}.pdf`,pdf.output('blob'));
  }catch(e){toast('The PDF could not be built. Try removing very large photos.');}
  btn.disabled=false;btn.textContent=label;
});
$('#saveDraft').addEventListener('click',()=>offer(`CMA draft - ${safeName(S.cover.address)}.json`,JSON.stringify(S)));
$('#openDraft').addEventListener('click',()=>$('#draftFile').click());
$('#draftFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.cover||!d.comps) throw 0;S=d;importMsg='';changed(true);toast('Opened '+f.name);}catch(err){toast('That file is not a CMA draft from this builder.');}};r.readAsText(f);e.target.value='';});
function saveTemplate(){
  const h='Status,Address,Town,School District,Close Date,List Price,Sold Price,Beds,Baths,Living Area,Lot Size,DOM,Pool,Taxes,Style,Year Built\n';
  offer('CMA comps template.csv',h+'Sold,,,,,,,,,,,,,,,\nPending,,,,,,,,,,,,,,,\nActive,,,,,,,,,,,,,,,\n');
}
let confirmNew=false;
$('#newCma').addEventListener('click',()=>{
  const b=$('#newCma');
  if(!confirmNew){confirmNew=true;b.textContent='Click again to clear';setTimeout(()=>{confirmNew=false;b.textContent='Start new CMA';},3500);return;}
  confirmNew=false;b.textContent='Start new CMA';
  const agent=S.agent; S=blankReport(agent); importMsg=''; openSecs.clear(); openSecs.add('cover'); openComps.clear(); changed(true); $('#form').scrollTop=0; toast('New CMA started. Your agent details were kept.');
});

renderForm();
document.fonts.ready.then(renderPages); renderPages();
})();
</script>
</body>
